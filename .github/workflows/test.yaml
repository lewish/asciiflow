name: Test

on: pull_request

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run tests and build
        uses: "docker://mattinsler/bazelisk:latest"
        with:
          args: bash -c "bazel test //common:all //client:all && bazel build //client:site"
